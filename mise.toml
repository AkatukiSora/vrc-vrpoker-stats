[tools]
go = "1.25.0"
lefthook = "2.1.1"
"go:github.com/asiermarques/adrgen" = "v0.4.1-beta"

[env]
BINARY = "vrpoker-stats"
BUILD_TAGS = "wayland"
CGO_ENABLED = "1"

# ── Tasks ─────────────────────────────────────────────────────────────────────

[tasks.build]
description = "Build the binary (Wayland)"
run = '''
  VERSION="${VERSION:-dev}"
  COMMIT="${COMMIT:-local}"
  BUILD_DATE="${BUILD_DATE:-unknown}"
  go build -tags "$BUILD_TAGS" \
    -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}" \
    -o "$BINARY" .
'''
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = ["{{env.BINARY}}"]

[tasks.build-debug]
description = "Build with debug info (no stripping)"
run = '''
  VERSION="${VERSION:-dev}"
  COMMIT="${COMMIT:-local}"
  BUILD_DATE="${BUILD_DATE:-unknown}"
  go build -tags "$BUILD_TAGS" \
    -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}" \
    -o "${BINARY}-debug" .
'''

[tasks.build-windows]
description = "Cross-build Windows amd64 binary (requires MinGW)"
run = '''
  if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
    echo "Error: x86_64-w64-mingw32-gcc not found"
    echo "Install MinGW first, e.g. on Ubuntu: sudo apt-get install -y gcc-mingw-w64-x86-64"
    exit 1
  fi
  VERSION="${VERSION:-dev}"
  COMMIT="${COMMIT:-local}"
  BUILD_DATE="${BUILD_DATE:-unknown}"
  CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
    go build -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}" \
    -o "${BINARY}.exe" .
'''

[tasks.deps-linux]
description = "Install Linux build dependencies (Wayland + MinGW cross toolchain)"
run = '''
  if ! command -v apt-get >/dev/null 2>&1; then
    echo "Error: apt-get not found. Install dependencies manually for your distro."
    exit 1
  fi

  sudo apt-get update -qq
  sudo apt-get install -y --no-install-recommends \
    libwayland-dev \
    libxkbcommon-dev \
    libegl-dev \
    libgles2-mesa-dev \
    pkg-config \
    gcc \
    gcc-mingw-w64-x86-64 \
    zip
'''

[tasks.check-toolchain]
description = "Check required local toolchain binaries"
run = '''
  command -v go
  command -v gcc || echo "warn: gcc not found (Linux native build may fail)"
  command -v pkg-config || echo "warn: pkg-config not found (Linux native build may fail)"
  command -v x86_64-w64-mingw32-gcc || echo "warn: MinGW not found (Windows cross-build unavailable)"
  mise exec -- lefthook version
'''

[tasks.run]
description = "Build and run (Wayland)"
depends = ["build"]
run = './"$BINARY"'

[tasks.run-debug]
description = "Build and run with debug logging enabled"
depends = ["build-debug"]
run = './"${BINARY}-debug" --debug'

[tasks.test]
description = "Run unit tests (parser/stats/watcher fast suite)"
run = 'go test -cover ./...'

[tasks.test-ui]
description = "Run hand-history UI regression suite"
run = "go test -run 'TestHand.*' ./internal/ui/..."

[tasks.test-coverage]
description = "Generate test coverage report"
run = """
  go test -coverprofile=coverage.out ./...
  go tool cover -html=coverage.out
  rm coverage.out
"""

[tasks.lint]
description = "Run go vet"
run = "go vet -tags \"$BUILD_TAGS\" ./..."

[tasks.tidy]
description = "Tidy go modules"
run = "go mod tidy"

[tasks.check-i18n]
description = "Check UI strings use i18n wrappers"
run = "go run ./tools/check_i18n"

[tasks.clean]
description = "Remove build artifacts"
run = 'rm -f "$BINARY" "${BINARY}-debug"'

[tasks.adr-list]
description = "List ADRs with status"
run = "adrgen list"

[tasks.adr-new]
description = "Create a new ADR (mise run adr-new -- \"Title\")"
run = 'adrgen create "$@"'

[tasks.setup]
description = "Set up development environment (install lefthook, tidy modules)"
run = '''
  echo "🔧 Setting up development environment..."
  
  # Tidy Go modules
  echo "📦 Tidying Go modules..."
  go mod tidy
  
  echo "📥 Installing tools declared in mise.toml..."
  mise install

  echo "🧪 Checking required toolchain commands..."
  mise run check-toolchain
  
  # Install lefthook git hooks
  echo "🪝 Installing git hooks via lefthook..."
  mise exec -- lefthook install -f
  
  echo "✨ Development environment setup complete!"
  echo ""
  echo "Next steps:"
  echo "  - On Ubuntu/Debian, run 'mise run deps-linux' once for native deps"
  echo "  - Review lefthook.yaml for hook configuration"
  echo "  - Run 'mise run build' to build the binary"
  echo "  - Run 'mise run test' to run tests"
'''

[tasks.gen-testlogs]
description = "Generate synthetic VRChat poker log files for testing"
run = '''
  OUTPUT_DIR="${OUTPUT_DIR:-${HOME}/testlogs}"
  COUNT="${COUNT:-100}"
  MIN_SIZE="${MIN_SIZE:-2097152}"
  MAX_SIZE="${MAX_SIZE:-52428800}"
  SEED="${SEED:-0}"
  START_DATE="${START_DATE:-2025-01-01}"
  go run ./tools/gen_testlog \
    --input-dir . \
    --output-dir "${OUTPUT_DIR}" \
    --count "${COUNT}" \
    --min-size "${MIN_SIZE}" \
    --max-size "${MAX_SIZE}" \
    --seed "${SEED}" \
    --start-date "${START_DATE}"
'''

[tasks.ci]
description = "Run full CI pipeline locally (lint + test + build)"
depends = ["lint", "test", "test-ui", "build"]
